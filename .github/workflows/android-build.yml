name: Build ViralToolAI APK

on:
  push:
    branches:
      - main
      - master
      - 'feature/**'
  pull_request:
    branches:
      - main
      - master
  workflow_dispatch:
    inputs:
      build_type:
        description: 'Select Build Type'
        required: true
        default: 'debug'
        type: choice
        options:
          - debug
          - release_placeholder

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build & Package Android APK
    runs-on: ubuntu-latest

    steps:
      - name: 1. Checkout Repository
        uses: actions/checkout@v4

      - name: 2. Setup Java 17 (JDK)
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: 3. Setup Gradle & Cache
        uses: gradle/actions/setup-gradle@v3
        with:
          cache-disabled: false

      - name: 4. Ensure Gradle Wrapper
        run: |
          ls -la
          find . -name "gradlew"

      - name: 5. Build Debug APK
        run: |
          ./gradlew assembleDebug --parallel --build-cache --stacktrace

      - name: 6. Upload Debug APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ViralToolAI-Debug-APK
          path: app/build/outputs/apk/debug/app-debug.apk
          retention-days: 30
          if-no-files-found: error

      - name: 7. Generate Build Summary
        if: success()
        run: |
          echo "### ✅ ViralToolAI Build Successful" >> $GITHUB_STEP_SUMMARY
          echo "- **App Name:** ViralToolAI v1.0 Stable" >> $GITHUB_STEP_SUMMARY
          echo "- **Branch:** \`${{ github.ref_name }}\`" >> $GITHUB_STEP_SUMMARY
          echo "- **Commit SHA:** \`${{ github.sha }}\`" >> $GITHUB_STEP_SUMMARY
          echo "- **Build Time:** $(date -u +'%Y-%m-%d %H:%M:%S UTC')" >> $GITHUB_STEP_SUMMARY
          echo "- **Artifact:** \`ViralToolAI-Debug-APK\` (Saved for 30 Days)" >> $GITHUB_STEP_SUMMARY
          echo "- **Status:** Debug APK generated successfully and ready for testing." >> $GITHUB_STEP_SUMMARY

      - name: 8. Failure Report Logging
        if: failure()
        run: |
          echo "### ❌ ViralToolAI Build Failed" >> $GITHUB_STEP_SUMMARY
          echo "- **Branch:** \`${{ github.ref_name }}\`" >> $GITHUB_STEP_SUMMARY
          echo "- **Commit SHA:** \`${{ github.sha }}\`" >> $GITHUB_STEP_SUMMARY
          echo "- **Timestamp:** $(date -u +'%Y-%m-%d %H:%M:%S UTC')" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Troubleshooting Steps:**" >> $GITHUB_STEP_SUMMARY
          echo "1. Verify Kotlin version and dependency compatibility in \`gradle/libs.versions.toml\`." >> $GITHUB_STEP_SUMMARY
          echo "2. Check Gradle build log output above for detailed stack trace." >> $GITHUB_STEP_SUMMARY
          echo "3. Run \`./gradlew assembleDebug\` locally or re-trigger this GitHub Action." >> $GITHUB_STEP_SUMMARY

